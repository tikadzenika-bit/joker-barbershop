<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <link rel="stylesheet" href="/src/styles/site.css" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 330px; gap: 56px; align-items: center; padding: 0 84px 0 76px; }
      .og__k { font: 600 22px/1 var(--font-text); letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); margin-bottom: 26px; }
      .og__t { font-size: 124px; line-height: 0.9; }
      .og__t span { display: block; }
      .og__t span:nth-child(2) { color: var(--red); }
      .og__s { margin-top: 30px; font: 600 27px/1.3 var(--font-text); color: var(--ink-2); }
      .deck { width: 330px; }
      .joker__mark b { font-size: 52px; }
      .joker__words { font-size: 19px; }
    </style>
  </head>
  <body>
    <div>
      <p class="og__k">JOKER Barbershop · თბილისი</p>
      <p class="display og__t"><span>Peace</span><span>Friendship</span><span>Haircut</span></p>
      <p class="og__s">ბარბერშოპი საბურთალოზე · ონლაინ ჩაწერა</p>
    </div>
    <div class="deck">
      <div class="pcard pcard--brand">
        <span class="idx"><b>J</b></span><span class="idx idx--b"><b>J</b></span>
        <div class="pcard__face"><div class="joker"><div class="joker__mark"><b class="display">JOKER</b><small>Barbershop</small></div><p class="joker__words"><span>ჯოკერი</span></p></div></div>
      </div>
    </div>
  </body>
</html>
